<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <style>
    .plug { font-size: 16px; font-weight: 700; fill: #7d8590; }
    .note { font-size: 12.5px; fill: #8b949e; }
    .srv  { font-size: 12px; fill: #8b949e; }
    .val  { font-size: 13px; font-weight: 700; fill: #8b949e; }
    .hdr  { font-size: 18px; font-weight: 700; fill: #7d8590; }
    .sub  { font-size: 12px; fill: #7d8590; }
    .good { fill: #3fb950; } .mid { fill: #d0a215; } .bad { fill: #f85149; } .bse { fill: #9aa2af; }
  </style>
  <text x="20" y="30" class="hdr">Response speed (TTFB) — single visitor, homepage, warm cache</text>
  <text x="20" y="50" class="sub">Test 2 · 2026-09-08 · LOWER = FASTER · median of 15 requests · Google recommends &lt; 200 ms</text>

  <!-- google line at 200ms: scale 0.55px/ms => 200ms = 110px from x0=230 -->
  <line x1="340" y1="70" x2="340" y2="520" stroke="#d0a215" stroke-dasharray="4 4" stroke-width="1"/>
  <text x="346" y="82" class="sub" fill="#d0a215">Google 200 ms</text>

  <text x="20" y="112" class="plug" fill="#9aa2af">No cache (baseline)</text>
  <rect x="230" y="120" width="468" height="14" rx="2" class="bse"/>
  <text x="706" y="132" class="val">850 ms</text>

  <text x="20" y="176" class="plug" fill="#a371f7">1. Turbo Cache 3.2.4</text>
  <text x="160" y="176" class="note">✅ under the Google line on every web server</text>
  <text x="105" y="198" class="srv">all servers</text> <rect x="230" y="188" width="89" height="14" rx="2" class="good"/><text x="327" y="200" class="val">161 ms ✅</text>

  <text x="20" y="262" class="plug">2. LiteSpeed Cache</text>
  <text x="200" y="262" class="note">fast only at home — worse than baseline elsewhere</text>
  <text x="150" y="284" class="srv">OLS</text>    <rect x="230" y="274" width="84" height="14" rx="2" class="good"/><text x="322" y="286" class="val">153 ms ✅</text>
  <text x="90" y="304" class="srv">Nginx/Apache</text> <rect x="230" y="294" width="505" height="14" rx="2" class="bad"/><text x="600" y="306" class="val" fill="#fff">918 ms — slower than no cache!</text>

  <text x="20" y="348" class="plug">3. WP Rocket</text>
  <text x="160" y="348" class="note">consistent everywhere</text>
  <text x="105" y="370" class="srv">all servers</text> <rect x="230" y="360" width="85" height="14" rx="2" class="good"/><text x="323" y="372" class="val">155 ms ✅</text>

  <text x="20" y="416" class="plug">4-6. W3TC · WP Super Cache · WP Fastest Cache</text>
  <text x="105" y="438" class="srv">all servers</text> <rect x="230" y="428" width="473" height="14" rx="2" class="bse"/><text x="600" y="440" class="val" fill="#fff">~860 ms — cache never engages</text>

  <text x="20" y="500" class="sub">Cached hits are served in under 1 ms by the server; the ~150 ms shown is the connection's TLS handshake.</text>
  <text x="20" y="518" class="sub">TTFB under 200 ms improves crawl budget and Core Web Vitals — direct SEO impact.</text>
</svg>
