<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <style>
    .lbl { font-size: 14px; fill: #888e99; }
    .val { font-size: 14px; font-weight: 600; fill: #888e99; }
    .hdr { font-size: 17px; font-weight: 700; fill: #7d8590; }
    .sub { font-size: 12px; fill: #7d8590; }
    .base { fill: #9aa2af; }
    .lsc  { fill: #3fb950; }
    .rkt  { fill: #e8833a; }
  </style>
  <text x="20" y="30" class="hdr">Warm-cache throughput — 50 concurrent users (requests/second)</text>
  <text x="20" y="50" class="sub">Round 1 · 2026-09 · self-test¹ · higher is better · median of 3 × 60 s runs</text>

  <!-- Nginx -->
  <text x="20" y="93" class="lbl">Nginx — no cache</text>
  <rect x="255" y="80" width="20" height="16" rx="3" class="base"/>
  <text x="283" y="93" class="val">7.4</text>
  <text x="20" y="118" class="lbl">Nginx — LiteSpeed Cache</text>
  <rect x="255" y="105" width="18" height="16" rx="3" class="lsc"/>
  <text x="281" y="118" class="val">6.4 (page cache inert)</text>
  <text x="20" y="143" class="lbl">Nginx — WP Rocket</text>
  <rect x="255" y="130" width="527" height="16" rx="3" class="rkt"/>
  <text x="530" y="143" class="val" fill="#fff">193.3</text>

  <!-- Apache -->
  <text x="20" y="188" class="lbl">Apache — no cache</text>
  <rect x="255" y="175" width="20" height="16" rx="3" class="base"/>
  <text x="283" y="188" class="val">7.3</text>
  <text x="20" y="213" class="lbl">Apache — LiteSpeed Cache</text>
  <rect x="255" y="200" width="18" height="16" rx="3" class="lsc"/>
  <text x="281" y="213" class="val">6.4 (page cache inert)</text>
  <text x="20" y="238" class="lbl">Apache — WP Rocket</text>
  <rect x="255" y="225" width="521" height="16" rx="3" class="rkt"/>
  <text x="530" y="238" class="val" fill="#fff">190.9</text>

  <!-- OLS -->
  <text x="20" y="283" class="lbl">OpenLiteSpeed — no cache</text>
  <rect x="255" y="270" width="20" height="16" rx="3" class="base"/>
  <text x="283" y="283" class="val">7.3</text>
  <text x="20" y="308" class="lbl">OpenLiteSpeed — LiteSpeed Cache</text>
  <rect x="255" y="295" width="532" height="16" rx="3" class="lsc"/>
  <text x="530" y="308" class="val" fill="#fff">194.9</text>
  <text x="20" y="333" class="lbl">OpenLiteSpeed — WP Rocket</text>
  <rect x="255" y="320" width="526" height="16" rx="3" class="rkt"/>
  <text x="530" y="333" class="val" fill="#fff">192.9</text>

  <text x="20" y="378" class="sub">All cached results ~192-195 RPS are capped by the self-test setup (k6 shares the same 4 cores).</text>
  <text x="20" y="395" class="sub">¹ load generator ran on the target server itself; external re-measurement pending.</text>
  <text x="20" y="412" class="sub">Turbo · W3TC · WP Super Cache · WP Fastest Cache — coming in this round.</text>
</svg>
