
virtualhost bench {
  vhRoot                  /var/www/bench
  configFile              conf/vhosts/bench/vhconf.conf
  allowSymbolLink         1
  enableScript            1
  restrained              0
}

listener BenchHTTP {
  address                 *:80
  secure                  0
  map                     bench bench.fama.co.ir
}

listener BenchHTTPS {
  address                 *:443
  secure                  1
  keyFile                 /etc/letsencrypt/live/bench.fama.co.ir/privkey.pem
  certFile                /etc/letsencrypt/live/bench.fama.co.ir/fullchain.pem
  map                     bench bench.fama.co.ir
}
