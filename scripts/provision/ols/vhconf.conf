docRoot                   /var/www/bench
vhDomain                  bench.fama.co.ir
adminEmails               bench@example.com
enableGzip                1

index  {
  useServer               0
  indexFiles              index.php, index.html
}

errorlog $VH_ROOT/logs/error.log {
  useServer               0
  logLevel                ERROR
  rollingSize             10M
}

scripthandler  {
  add                     lsapi:lsphp82 php
}

extprocessor lsphp82 {
  type                    lsapi
  address                 uds://tmp/lshttpd/bench-lsphp82.sock
  maxConns                12
  env                     PHP_LSAPI_CHILDREN=12
  env                     LSAPI_AVOID_FORK=200M
  initTimeout             60
  retryTimeout            0
  persistConn             1
  respBuffer              0
  autoStart               1
  path                    /usr/local/lsws/lsphp82/bin/lsphp
  backlog                 100
  instances               1
  memSoftLimit            2047M
  memHardLimit            2047M
  procSoftLimit           400
  procHardLimit           500
}

# CRITICAL: httpd_config.conf MUST set `httpdWorkers 1`.
# With multiple OLS workers, each opens its own conn pool to the single lsphp
# parent (12 children); requests pinned to a starved pool hang 30-60s with
# "No request delivery notification ... possible dead lock" and k6 timeouts.
# Verified 2026-09-07: 4 workers -> 6-11% errors; 1 worker -> 0 errors, RPS on
# par with nginx/apache. Re-evaluate worker count for cache-HIT loads later.

rewrite  {
  enable                  1
  autoLoadHtaccess        1
  rules                   <<<END_rules
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^ index.php [L]
  END_rules
}
